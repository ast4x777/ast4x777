      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
      .ascii { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:10px; fill:#06B6D4; letter-spacing:.2px; }
      .small { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:12px; fill:#475569; }
      .name { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:27px; font-weight:800; fill:#0F172A; }
      .headline { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:14px; font-weight:700; fill:#06B6D4; letter-spacing:1px; }
      .section { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:11px; font-weight:700; fill:#475569; letter-spacing:2px; }
      .label { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:11px; font-weight:700; fill:#06B6D4; }
      .value { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:11px; fill:#0F172A; }
      .pill { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:10px; font-weight:700; fill:#0F172A; }
    </style>
